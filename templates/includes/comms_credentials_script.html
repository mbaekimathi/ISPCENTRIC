<script>
(function () {
  var form = document.getElementById("comms-settings-form");
  if (!form) return;
  var fetchUrl = form.getAttribute("data-comms-fetch-url") || "";
  var csrf = (form.querySelector("[name=csrfmiddlewaretoken]") || {}).value || "";
  var fetchTimers = {};

  function syncChannel(card) {
    var checkbox = card.querySelector(".settings-policy-switch input[type='checkbox']");
    var body = card.querySelector("[data-comms-body]");
    var pill = card.querySelector("[data-comms-pill]");
    var label = card.querySelector("[data-comms-switch-label]");
    var on = !!(checkbox && checkbox.checked);
    card.classList.toggle("is-channel-on", on);
    if (body) body.hidden = !on;
    if (pill) {
      pill.textContent = on ? "On" : "Off";
      pill.classList.toggle("is-on", on);
      pill.classList.toggle("is-off", !on);
    }
    if (!label || !checkbox) return;
    if (checkbox.id === "id_sms_enabled") label.textContent = on ? "SMS enabled" : "SMS disabled";
    if (checkbox.id === "id_email_enabled") label.textContent = on ? "Email enabled" : "Email disabled";
    if (checkbox.id === "id_whatsapp_enabled") label.textContent = on ? "WhatsApp enabled" : "WhatsApp disabled";
  }

  function syncSmsProvider() {
    var select = document.getElementById("id_sms_provider");
    var value = select ? select.value : "";
    var usernameLabel = form.querySelector("[data-sms-username-label]");
    var usernameHint = form.querySelector("[data-sms-username-hint]");
    var apiKeyLabel = form.querySelector("[data-sms-api-key-label]");
    var apiKeyHint = form.querySelector("[data-sms-api-key-hint]");
    form.querySelectorAll("[data-sms-extra]").forEach(function (el) {
      var kind = el.getAttribute("data-sms-extra");
      if (kind === "url") el.hidden = value !== "custom";
      else el.hidden = false;
    });
    if (value === "twilio") {
      if (usernameLabel) usernameLabel.textContent = "Account SID";
      if (usernameHint) usernameHint.textContent = "Twilio Account SID starting with AC.";
      if (apiKeyLabel) apiKeyLabel.textContent = "Auth token";
      if (apiKeyHint) apiKeyHint.textContent = "Twilio Auth Token.";
    } else if (value === "custom") {
      if (usernameLabel) usernameLabel.textContent = "Username (optional)";
      if (usernameHint) usernameHint.textContent = "Optional username if your gateway needs one.";
      if (apiKeyLabel) apiKeyLabel.textContent = "API key";
      if (apiKeyHint) apiKeyHint.textContent = "Sent as api_key in the JSON body.";
    } else {
      if (usernameLabel) usernameLabel.textContent = "Username";
      if (usernameHint) usernameHint.textContent = "Africa's Talking username. Use sandbox for testing.";
      if (apiKeyLabel) apiKeyLabel.textContent = "API key";
      if (apiKeyHint) apiKeyHint.textContent = "Africa's Talking API key from the dashboard.";
    }
  }

  function syncWhatsappProvider() {
    var select = document.getElementById("id_whatsapp_provider");
    var value = select ? select.value : "";
    var usernameLabel = form.querySelector("[data-whatsapp-username-label]");
    var apiKeyLabel = form.querySelector("[data-whatsapp-api-key-label]");
    form.querySelectorAll("[data-whatsapp-extra]").forEach(function (el) {
      var kind = el.getAttribute("data-whatsapp-extra");
      var showMeta = value === "meta";
      var showGateway = value === "twilio" || value === "africastalking";
      if (kind === "meta-id" || kind === "meta-token") el.hidden = !showMeta;
      else el.hidden = !showGateway;
    });
    if (value === "twilio") {
      if (usernameLabel) usernameLabel.textContent = "Account SID";
      if (apiKeyLabel) apiKeyLabel.textContent = "Auth token";
    } else {
      if (usernameLabel) usernameLabel.textContent = "Username";
      if (apiKeyLabel) apiKeyLabel.textContent = "API key";
    }
  }

  function setFetchStatus(channel, text, isError) {
    var status = form.querySelector("[data-comms-fetch-status='" + channel + "']");
    if (!status) return;
    status.textContent = text || "";
    status.classList.toggle("is-error", !!isError);
  }

  function fillSelect(channel, items) {
    var select = form.querySelector("[data-comms-fetch-select='" + channel + "']");
    if (!select) return;
    select.innerHTML = "";
    var placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = items.length ? "Choose a fetched option, or keep typing your own" : "No listed senders — type any value";
    select.appendChild(placeholder);
    items.forEach(function (item) {
      var option = document.createElement("option");
      option.value = item.value || "";
      option.textContent = item.label || item.value || "";
      option.setAttribute("data-type", item.type || "");
      if (item.phone) option.setAttribute("data-phone", item.phone);
      select.appendChild(option);
    });
    select.hidden = false;
  }

  function applySmsSender(value, type) {
    var sender = document.getElementById("id_sms_sender_id");
    var from = document.getElementById("id_sms_from_number");
    if (sender) sender.value = value || "";
    if (from) from.value = value || "";
  }

  function applyWhatsappSender(value, type, phone) {
    var phoneId = document.getElementById("id_whatsapp_phone_number_id");
    var from = document.getElementById("id_whatsapp_from_number");
    if (type === "meta_id") {
      if (phoneId) phoneId.value = value || "";
      if (from && phone) from.value = phone;
      return;
    }
    if (from) from.value = phone || value || "";
    if (phoneId && type !== "service") phoneId.value = value || phoneId.value;
  }

  function collectPayload(channel) {
    var payload = { channel: channel };
    ["sms_provider", "sms_username", "sms_api_key", "sms_base_url", "sms_sender_id", "sms_from_number",
     "email_host", "email_host_user", "email_from_email", "email_port",
     "whatsapp_provider", "whatsapp_username", "whatsapp_api_key", "whatsapp_access_token",
     "whatsapp_phone_number_id", "whatsapp_from_number"].forEach(function (name) {
      var field = form.querySelector("[name='" + name + "']");
      if (field) payload[name] = field.value || "";
    });
    var tls = document.getElementById("id_email_use_tls");
    if (tls) payload.email_use_tls = tls.checked ? "1" : "";
    return payload;
  }

  function applySmtp(smtp) {
    if (!smtp) return;
    var host = document.getElementById("id_email_host");
    var port = document.getElementById("id_email_port");
    var tls = document.getElementById("id_email_use_tls");
    if (host && (!host.value || host.dataset.commsAutofilled === "1")) {
      host.value = smtp.host || host.value;
      host.dataset.commsAutofilled = "1";
    }
    if (port && smtp.port) port.value = smtp.port;
    if (tls && typeof smtp.use_tls === "boolean") tls.checked = smtp.use_tls;
  }

  function fetchChannel(channel, silent) {
    if (!fetchUrl) return;
    if (!silent) setFetchStatus(channel, "Fetching…");
    fetch(fetchUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": csrf,
        "X-Requested-With": "XMLHttpRequest",
      },
      credentials: "same-origin",
      body: JSON.stringify(collectPayload(channel)),
    })
      .then(function (response) { return response.json().then(function (data) {
        return { okHttp: response.ok, data: data || {} };
      }); })
      .then(function (result) {
        var data = result.data || {};
        if (!data.ok) {
          setFetchStatus(channel, data.error || "Could not fetch provider options.", true);
          return;
        }
        if (channel === "email") {
          applySmtp(data.smtp);
          setFetchStatus(channel, data.message || "");
          return;
        }
        fillSelect(channel, data.items || []);
        setFetchStatus(channel, data.message || "");
      })
      .catch(function () {
        setFetchStatus(channel, "Could not reach the provider.", true);
      });
  }

  function scheduleFetch(channel) {
    window.clearTimeout(fetchTimers[channel]);
    fetchTimers[channel] = window.setTimeout(function () { fetchChannel(channel, true); }, 700);
  }

  function smsReady() {
    var provider = (document.getElementById("id_sms_provider") || {}).value || "";
    var username = (document.getElementById("id_sms_username") || {}).value || "";
    var apiKey = (document.getElementById("id_sms_api_key") || {}).value || "";
    var url = (document.getElementById("id_sms_base_url") || {}).value || "";
    if (provider === "custom") return !!url;
    return !!(username && apiKey);
  }

  function whatsappReady() {
    var provider = (document.getElementById("id_whatsapp_provider") || {}).value || "";
    if (provider === "meta") return !!((document.getElementById("id_whatsapp_access_token") || {}).value);
    return !!((document.getElementById("id_whatsapp_username") || {}).value && (document.getElementById("id_whatsapp_api_key") || {}).value);
  }

  function emailReady() {
    return !!((document.getElementById("id_email_host_user") || {}).value || (document.getElementById("id_email_from_email") || {}).value);
  }

  form.querySelectorAll("[data-comms-channel]").forEach(function (card) {
    var checkbox = card.querySelector(".settings-policy-switch input[type='checkbox']");
    if (checkbox) checkbox.addEventListener("change", function () { syncChannel(card); });
    syncChannel(card);
  });

  var smsProvider = document.getElementById("id_sms_provider");
  if (smsProvider) smsProvider.addEventListener("change", function () {
    syncSmsProvider();
    if (smsReady()) scheduleFetch("sms");
  });
  var whatsappProvider = document.getElementById("id_whatsapp_provider");
  if (whatsappProvider) whatsappProvider.addEventListener("change", function () {
    syncWhatsappProvider();
    if (whatsappReady()) scheduleFetch("whatsapp");
  });
  syncSmsProvider();
  syncWhatsappProvider();

  ["id_sms_username", "id_sms_api_key", "id_sms_base_url"].forEach(function (id) {
    var field = document.getElementById(id);
    if (!field) return;
    field.addEventListener("blur", function () { if (smsReady()) scheduleFetch("sms"); });
    field.addEventListener("change", function () { if (smsReady()) scheduleFetch("sms"); });
  });
  ["id_whatsapp_username", "id_whatsapp_api_key", "id_whatsapp_access_token", "id_whatsapp_phone_number_id"].forEach(function (id) {
    var field = document.getElementById(id);
    if (!field) return;
    field.addEventListener("blur", function () { if (whatsappReady()) scheduleFetch("whatsapp"); });
    field.addEventListener("change", function () { if (whatsappReady()) scheduleFetch("whatsapp"); });
  });
  ["id_email_host_user", "id_email_from_email"].forEach(function (id) {
    var field = document.getElementById(id);
    if (!field) return;
    field.addEventListener("blur", function () { if (emailReady()) scheduleFetch("email"); });
    field.addEventListener("change", function () { if (emailReady()) scheduleFetch("email"); });
  });

  form.querySelectorAll("[data-comms-fetch]").forEach(function (button) {
    button.addEventListener("click", function () {
      fetchChannel(button.getAttribute("data-comms-fetch") || "", false);
    });
  });

  var smsSelect = form.querySelector("[data-comms-fetch-select='sms']");
  if (smsSelect) smsSelect.addEventListener("change", function () {
    var option = smsSelect.options[smsSelect.selectedIndex];
    applySmsSender(smsSelect.value, option ? option.getAttribute("data-type") : "");
  });
  var whatsappSelect = form.querySelector("[data-comms-fetch-select='whatsapp']");
  if (whatsappSelect) whatsappSelect.addEventListener("change", function () {
    var option = whatsappSelect.options[whatsappSelect.selectedIndex];
    applyWhatsappSender(
      whatsappSelect.value,
      option ? option.getAttribute("data-type") : "",
      option ? option.getAttribute("data-phone") : ""
    );
  });

  var sender = document.getElementById("id_sms_sender_id");
  var from = document.getElementById("id_sms_from_number");
  if (sender && from) {
    sender.addEventListener("input", function () { from.value = sender.value; });
    if (!sender.value && from.value) sender.value = from.value;
  }
})();
</script>
