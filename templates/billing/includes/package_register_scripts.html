<script>
(function () {
  function openModal(id) {
    var modal = document.getElementById(id);
    if (!modal) return;
    closeAll();
    modal.hidden = false;
    modal.setAttribute("aria-hidden", "false");
    document.body.classList.add("role-modal-open");
  }

  function closeModal(modal) {
    if (!modal) return;
    modal.hidden = true;
    modal.setAttribute("aria-hidden", "true");
    if (!document.querySelector(".client-action-modal:not([hidden])")) {
      document.body.classList.remove("role-modal-open");
    }
  }

  function closeAll() {
    document.querySelectorAll(".client-action-modal").forEach(closeModal);
  }

  document.querySelectorAll("[data-open-modal]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var modalId = btn.getAttribute("data-open-modal");
      openModal(modalId);
      // Fresh register: sync max-devices default to the selected service type.
      if (modalId === "billing-package-modal") {
        var pppoeRadio = document.querySelector(
          '#billing-package-register-form input[name="service_type"][value="pppoe"]'
        );
        if (pppoeRadio) pppoeRadio.checked = true;
        if (registerWizard) {
          registerWizard.setDeviceMode("single");
          registerWizard.sync();
        } else {
          applyRegisterMaxDevicesDefault();
        }
      }
      if (typeof window.syncPackageWizardForModal === "function") {
        window.syncPackageWizardForModal(modalId);
      }
    });
  });

  document.querySelectorAll("[data-close-client-modal]").forEach(function (el) {
    el.addEventListener("click", function () {
      closeModal(el.closest(".client-action-modal"));
    });
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    var open = document.querySelector(".client-action-modal:not([hidden])");
    if (open) closeModal(open);
  });

  function wireImagePreview(inputId, previewId, imgId, fileNameId, emptyHint) {
    var imageInput = document.getElementById(inputId);
    var preview = document.getElementById(previewId);
    var previewImg = document.getElementById(imgId);
    var previewEmpty = preview ? preview.querySelector(".package-image-preview-empty") : null;
    var fileName = document.getElementById(fileNameId);
    if (!imageInput) return;

    function showExisting(url) {
      if (!previewImg) return;
      if (url) {
        previewImg.src = url;
        previewImg.hidden = false;
        if (previewEmpty) previewEmpty.hidden = true;
        if (preview) preview.classList.add("has-image");
      } else {
        previewImg.hidden = true;
        previewImg.removeAttribute("src");
        if (previewEmpty) previewEmpty.hidden = false;
        if (preview) preview.classList.remove("has-image");
      }
    }

    if (previewImg && previewImg.getAttribute("src")) {
      showExisting(previewImg.getAttribute("src"));
    }

    imageInput.addEventListener("change", function () {
      var file = imageInput.files && imageInput.files[0];
      if (!file) {
        if (fileName) fileName.textContent = emptyHint || "PNG, JPG, or WebP · optional · max 5 MB";
        showExisting("");
        return;
      }
      if (fileName) fileName.textContent = file.name;
      if (!previewImg) return;
      var url = URL.createObjectURL(file);
      previewImg.onload = function () { URL.revokeObjectURL(url); };
      previewImg.src = url;
      previewImg.hidden = false;
      if (previewEmpty) previewEmpty.hidden = true;
      if (preview) preview.classList.add("has-image");
    });

    return { showExisting: showExisting, fileName: fileName };
  }

  wireImagePreview(
    "id_package_image",
    "package-image-preview",
    "package-image-preview-img",
    "package-image-file-name"
  );
  var editImage = wireImagePreview(
    "id_edit_package_image",
    "edit-package-image-preview",
    "edit-package-image-preview-img",
    "edit-package-image-file-name",
    "Current image kept unless you choose a new one"
  );

  function wireSpeedHint(downId, upId, hintId) {
    var downInput = document.getElementById(downId);
    var upInput = document.getElementById(upId);
    var generalHint = document.getElementById(hintId);
    function updateGeneralSpeedHint() {
      if (!generalHint) return;
      var down = downInput && downInput.value ? downInput.value : "—";
      var up = upInput && upInput.value ? upInput.value : "—";
      generalHint.textContent = "General speed: " + down + "/" + up + " Mbps (from download/upload).";
    }
    if (downInput) downInput.addEventListener("input", updateGeneralSpeedHint);
    if (upInput) upInput.addEventListener("input", updateGeneralSpeedHint);
    updateGeneralSpeedHint();
    return updateGeneralSpeedHint;
  }

  wireSpeedHint("id_package_download_speed", "id_package_upload_speed", "package-general-speed-hint");
  var updateEditSpeedHint = wireSpeedHint(
    "id_edit_package_download_speed",
    "id_edit_package_upload_speed",
    "edit-package-general-speed-hint"
  );

  function wireMaxDevicesHint(formSelector) {
    var form = document.querySelector(formSelector);
    if (!form) return function () {};
    var hint = form.querySelector("[data-package-max-devices-hint]");
    if (!hint) return function () {};
    var pppoeText =
      "Leave blank for unlimited. PPPoE: CPEs that may dial this username (LAN behind one CPE is already unlimited).";
    function update() {
      var checked = form.querySelector('input[name="service_type"]:checked');
      hint.textContent = pppoeText;
      hint.hidden = !!(checked && checked.value === "hotspot");
    }
    form.querySelectorAll('input[name="service_type"]').forEach(function (radio) {
      radio.addEventListener("change", update);
    });
    update();
    return update;
  }

  // Register form only: Hotspot → 1 device, PPPoE → blank (unlimited).
  // Applied on service-type change and when opening a fresh register modal.
  function applyRegisterMaxDevicesDefault() {
    var input = document.getElementById("id_package_max_devices");
    if (!input) return;
    var checked = document.querySelector(
      '#billing-package-register-form input[name="service_type"]:checked'
    );
    if (!checked || checked.value !== "pppoe") return;
    input.value = "";
  }

  function wireRegisterMaxDevicesDefault() {
    document
      .querySelectorAll('#billing-package-register-form input[name="service_type"]')
      .forEach(function (radio) {
        radio.addEventListener("change", applyRegisterMaxDevicesDefault);
      });
  }
  wireMaxDevicesHint("#billing-package-register-form");
  wireRegisterMaxDevicesDefault();
  var updateEditMaxDevicesHint = wireMaxDevicesHint("#billing-package-edit-form");

  function wireOfferFields(formSelector) {
    var form = document.querySelector(formSelector);
    if (!form) return;
    var toggle = form.querySelector('input[name="offer_enabled"]');
    var countField = form.querySelector("[data-offer-count-field]");
    function update() {
      if (!countField) return;
      var enabled = toggle && toggle.checked;
      countField.hidden = !enabled;
      countField.querySelectorAll("input").forEach(function (input) {
        input.disabled = !enabled;
      });
    }
    if (toggle) toggle.addEventListener("change", update);
    update();
  }
  wireOfferFields("#billing-package-register-form");
  wireOfferFields("#billing-package-edit-form");

  function inferHotspotDeviceMode(maxDevices, otherEnabled, hourlyRate) {
    if (otherEnabled || (parseFloat(hourlyRate) || 0) > 0) return "multi";
    var raw = (maxDevices || "").trim();
    if (!raw) return "multi";
    var n = parseInt(raw, 10);
    if (isNaN(n) || n > 1) return "multi";
    return "single";
  }

  function parseMoney(value) {
    var n = parseFloat(value);
    return isNaN(n) ? 0 : n;
  }

  function wirePackageTypeWizard(formSelector) {
    var form = document.querySelector(formSelector);
    if (!form) return { sync: function () {}, setDeviceMode: function () {} };

    var wizard = form.querySelector("[data-package-type-wizard]");
    var serviceRadios = wizard
      ? wizard.querySelectorAll('input[name="service_type"]')
      : form.querySelectorAll('input[name="service_type"]');
    var deviceStep = wizard
      ? wizard.querySelector("[data-hotspot-device-step]")
      : form.querySelector("[data-hotspot-device-step]");
    var maxDevicesWrap = form.querySelector("[data-package-max-devices-wrap]");
    var maxDevicesLabel = form.querySelector("[data-package-max-devices-label]");
    var maxDevicesInput = form.querySelector('[name="max_devices"]');
    var otherEnabledInput = form.querySelector('[name="hotspot_other_devices_enabled"]');
    var hourlyRateInput = form.querySelector('[name="hotspot_hourly_rate_per_device"]');
    var startingPriceInput = form.querySelector('[name="hotspot_other_base_price"]');
    var priceInput = form.querySelector('[name="price"]');
    var durationUnitInput = form.querySelector('[name="duration_unit"]');
    var billingField = form.querySelector("[data-package-billing-field]");
    var priceWrap = form.querySelector("[data-package-price-wrap]");
    var multiPricing = form.querySelector("[data-package-hotspot-multi-pricing]");
    var deviceMode = "single";

    function serviceType() {
      var checked = form.querySelector('input[name="service_type"]:checked');
      return checked ? checked.value : "pppoe";
    }

    function lockDurationUnitToHours() {
      if (!durationUnitInput) return;
      durationUnitInput.value = "hours";
      durationUnitInput.disabled = true;
    }

    function unlockDurationUnit() {
      if (!durationUnitInput) return;
      durationUnitInput.disabled = false;
    }

    function syncOtherEnabledFromRate() {
      if (!otherEnabledInput) return;
      otherEnabledInput.checked = parseMoney(hourlyRateInput && hourlyRateInput.value) > 0;
    }

    function syncMultiPriceFields() {
      if (serviceType() !== "hotspot" || deviceMode !== "multi") return;
      if (!startingPriceInput || !priceInput) return;
      var startVal = (startingPriceInput.value || "").trim();
      if (startVal) priceInput.value = startVal;
    }

    function syncDeviceModeUi() {
      var isHotspot = serviceType() === "hotspot";
      var isMulti = isHotspot && deviceMode === "multi";
      var isSingleHotspot = isHotspot && !isMulti;
      var deviceTabButtons = wizard
        ? wizard.querySelectorAll("[data-device-tab]")
        : form.querySelectorAll("[data-device-tab]");

      deviceTabButtons.forEach(function (btn) {
        var active = btn.getAttribute("data-device-tab") === deviceMode;
        btn.classList.toggle("is-active", active);
        btn.setAttribute("aria-selected", active ? "true" : "false");
      });

      if (billingField) billingField.hidden = isMulti;
      if (priceWrap) priceWrap.hidden = isMulti;
      if (multiPricing) multiPricing.hidden = !isMulti;

      if (!isMulti) {
        unlockDurationUnit();
      }

      if (maxDevicesWrap) {
        if (!isHotspot) {
          maxDevicesWrap.hidden = false;
          if (maxDevicesLabel) {
            maxDevicesLabel.innerHTML = 'Max devices <span class="pppoe-optional">optional</span>';
          }
        } else {
          maxDevicesWrap.hidden = true;
          if (maxDevicesInput) maxDevicesInput.value = isMulti ? "1" : "1";
        }
      }

      if (isSingleHotspot) {
        if (otherEnabledInput) otherEnabledInput.checked = false;
        if (hourlyRateInput) hourlyRateInput.value = "0";
      } else if (isMulti) {
        if (startingPriceInput && priceInput) {
          var startVal = (startingPriceInput.value || "").trim();
          var priceVal = (priceInput.value || "").trim();
          if (!startVal && priceVal) startingPriceInput.value = priceVal;
        }
        syncMultiPriceFields();
        syncOtherEnabledFromRate();
      }
    }

    function syncServiceTabs() {
      var st = serviceType();
      var serviceTabButtons = wizard
        ? wizard.querySelectorAll("[data-service-tab]")
        : form.querySelectorAll("[data-service-tab]");
      serviceTabButtons.forEach(function (btn) {
        var active = btn.getAttribute("data-service-tab") === st;
        btn.classList.toggle("is-active", active);
        btn.setAttribute("aria-selected", active ? "true" : "false");
      });
      if (deviceStep) deviceStep.hidden = st !== "hotspot";
      if (st !== "hotspot") deviceMode = "single";
      syncDeviceModeUi();
      if (formSelector === "#billing-package-register-form" && serviceType() === "pppoe") {
        applyRegisterMaxDevicesDefault();
      }
      if (formSelector === "#billing-package-edit-form" && typeof updateEditMaxDevicesHint === "function") {
        updateEditMaxDevicesHint();
      }
    }

    function setServiceType(val) {
      var matched = false;
      serviceRadios.forEach(function (radio) {
        var isMatch = radio.value === val;
        radio.checked = isMatch;
        if (isMatch) matched = true;
      });
      if (matched) syncServiceTabs();
    }

    function onWizardClick(e) {
      var serviceBtn = e.target.closest("[data-service-tab]");
      if (serviceBtn && form.contains(serviceBtn)) {
        e.preventDefault();
        setServiceType(serviceBtn.getAttribute("data-service-tab") || "pppoe");
        return;
      }
      var deviceBtn = e.target.closest("[data-device-tab]");
      if (deviceBtn && form.contains(deviceBtn)) {
        e.preventDefault();
        deviceMode = deviceBtn.getAttribute("data-device-tab") || "single";
        syncDeviceModeUi();
      }
    }

    form.addEventListener("click", onWizardClick);

    serviceRadios.forEach(function (radio) {
      radio.addEventListener("change", syncServiceTabs);
    });

    if (hourlyRateInput) hourlyRateInput.addEventListener("input", syncOtherEnabledFromRate);
    if (startingPriceInput) startingPriceInput.addEventListener("input", syncMultiPriceFields);

    form.addEventListener("submit", function () {
      if (serviceType() === "hotspot" && deviceMode === "single") {
        if (maxDevicesInput) maxDevicesInput.value = "1";
        if (otherEnabledInput) otherEnabledInput.checked = false;
        if (hourlyRateInput) hourlyRateInput.value = "0";
        unlockDurationUnit();
      }
      if (serviceType() === "hotspot" && deviceMode === "multi") {
        var durationValueInput = form.querySelector('[name="duration_value"]');
        lockDurationUnitToHours();
        if (durationValueInput) durationValueInput.value = "1";
        syncOtherEnabledFromRate();
        if (maxDevicesInput) maxDevicesInput.value = "1";
        if (startingPriceInput && priceInput) {
          var startVal = (startingPriceInput.value || "").trim();
          if (startVal) priceInput.value = startVal;
          else if ((priceInput.value || "").trim()) startingPriceInput.value = priceInput.value;
        }
      }
      unlockDurationUnit();
    });

    syncServiceTabs();

    return {
      sync: syncServiceTabs,
      setDeviceMode: function (mode) {
        deviceMode = mode === "multi" ? "multi" : "single";
        syncDeviceModeUi();
      },
      inferModeFromValues: function (maxDevices, otherEnabled, hourlyRate) {
        deviceMode = inferHotspotDeviceMode(maxDevices, otherEnabled, hourlyRate);
        if (hourlyRateInput) hourlyRateInput.value = hourlyRate || "0";
        syncDeviceModeUi();
      },
    };
  }

  var registerWizard = wirePackageTypeWizard("#billing-package-register-form");
  var editWizard = wirePackageTypeWizard("#billing-package-edit-form");

  window.syncPackageWizardForModal = function (modalId) {
    if (modalId === "billing-package-modal" && registerWizard) {
      registerWizard.sync();
      return;
    }
    if (modalId === "billing-package-edit-modal" && editWizard) {
      editWizard.sync();
    }
  };

  {% if open_billing_modal %}
  openModal("{{ open_billing_modal|escapejs }}");
  if (typeof window.syncPackageWizardForModal === "function") {
    window.syncPackageWizardForModal("{{ open_billing_modal|escapejs }}");
  }
  {% endif %}

  function setFieldValue(id, value) {
    var el = document.getElementById(id);
    if (!el) return;
    el.value = value == null ? "" : value;
  }

  document.querySelectorAll("[data-edit-package]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      setFieldValue("id_edit_package_id", btn.getAttribute("data-package-id") || "");
      setFieldValue("id_edit_package_name", btn.getAttribute("data-package-name") || "");
      setFieldValue("id_edit_package_description", btn.getAttribute("data-package-description") || "");
      setFieldValue("id_edit_package_price", btn.getAttribute("data-package-price") || "");
      setFieldValue("id_edit_package_duration_value", btn.getAttribute("data-package-duration-value") || "1");
      setFieldValue("id_edit_package_duration_unit", btn.getAttribute("data-package-duration-unit") || "months");
      setFieldValue("id_edit_package_download_speed", btn.getAttribute("data-package-download") || "");
      setFieldValue("id_edit_package_upload_speed", btn.getAttribute("data-package-upload") || "");
      setFieldValue("id_edit_package_download_guaranteed", btn.getAttribute("data-package-download-guaranteed") || "0");
      setFieldValue("id_edit_package_upload_guaranteed", btn.getAttribute("data-package-upload-guaranteed") || "0");
      var maxDevices = btn.getAttribute("data-package-max-devices") || "";
      setFieldValue("id_edit_package_max_devices", maxDevices === "0" ? "" : maxDevices);
      setFieldValue(
        "id_edit_package_hotspot_other_base_price",
        btn.getAttribute("data-package-hotspot-other-base") ||
          btn.getAttribute("data-package-price") ||
          ""
      );
      setFieldValue(
        "id_edit_package_hotspot_hourly_rate_per_device",
        btn.getAttribute("data-package-hotspot-hourly-rate") || ""
      );
      var otherEnabled = document.getElementById("id_edit_package_hotspot_other_devices_enabled");
      if (otherEnabled) {
        otherEnabled.checked = btn.getAttribute("data-package-hotspot-other-enabled") === "1";
      }

      var offerEnabled = document.getElementById("id_edit_package_offer_enabled");
      if (offerEnabled) {
        offerEnabled.checked = btn.getAttribute("data-package-offer-enabled") === "1";
      }
      setFieldValue(
        "id_edit_package_offer_pay_count",
        btn.getAttribute("data-package-offer-pay-count") || "5"
      );
      wireOfferFields("#billing-package-edit-form");

      var serviceType = btn.getAttribute("data-package-service-type") || "pppoe";
      document.querySelectorAll('#billing-package-edit-form input[name="service_type"]').forEach(function (radio) {
        radio.checked = radio.value === serviceType;
      });

      var active = document.getElementById("id_edit_package_is_active");
      if (active) active.checked = btn.getAttribute("data-package-active") === "1";

      var selectedRouters = (btn.getAttribute("data-package-routers") || "")
        .split(",")
        .map(function (v) { return v.trim(); })
        .filter(Boolean);
      document.querySelectorAll('#billing-package-edit-form input[name="routers"]').forEach(function (box) {
        box.checked = selectedRouters.indexOf(String(box.value)) !== -1;
      });

      var imageInput = document.getElementById("id_edit_package_image");
      if (imageInput) imageInput.value = "";

      var imageUrl = btn.getAttribute("data-package-image") || "";
      if (editImage && editImage.showExisting) editImage.showExisting(imageUrl);
      if (editImage && editImage.fileName) {
        editImage.fileName.textContent = imageUrl
          ? "Current image kept unless you choose a new one"
          : "PNG, JPG, or WebP · optional · max 5 MB";
      }

      if (updateEditSpeedHint) updateEditSpeedHint();
      if (updateEditMaxDevicesHint) updateEditMaxDevicesHint();
      if (editWizard) {
        editWizard.sync();
        if (serviceType === "hotspot") {
          editWizard.inferModeFromValues(
            maxDevices,
            btn.getAttribute("data-package-hotspot-other-enabled") === "1",
            btn.getAttribute("data-package-hotspot-hourly-rate") || ""
          );
        } else {
          editWizard.setDeviceMode("single");
        }
      }
      openModal("billing-package-edit-modal");
      if (typeof window.syncPackageWizardForModal === "function") {
        window.syncPackageWizardForModal("billing-package-edit-modal");
      }
      var nameInput = document.getElementById("id_edit_package_name");
      if (nameInput) nameInput.focus();
    });
  });

  var offerModal = document.getElementById("billing-package-offer-modal");
  var offerForm = document.getElementById("billing-package-offer-form");
  if (offerModal && offerForm) {
    var offerId = document.getElementById("id_package_offer_id");
    var offerName = document.getElementById("billing-package-offer-name");
    var offerEnabled = document.getElementById("id_package_offer_enabled");
    var offerPayCount = document.getElementById("id_package_offer_pay_count");
    var offerCountWrap = offerForm.querySelector("[data-offer-modal-count]");
    var offerPreview = document.getElementById("billing-package-offer-preview");

    function updateOfferPreview() {
      var count = 5;
      if (offerPayCount && offerPayCount.value) {
        count = parseInt(offerPayCount.value, 10) || 5;
      }
      if (count < 1) count = 1;
      if (offerPreview) offerPreview.textContent = "Buy " + count + " get 1 free";
    }

    function syncOfferModalFields() {
      var on = offerEnabled && offerEnabled.checked;
      if (offerCountWrap) offerCountWrap.hidden = !on;
      if (offerPayCount) offerPayCount.disabled = !on;
      offerModal.classList.toggle("is-offer-on", !!on);
      updateOfferPreview();
    }

    if (offerEnabled) offerEnabled.addEventListener("change", syncOfferModalFields);
    if (offerPayCount) {
      offerPayCount.addEventListener("input", updateOfferPreview);
      offerPayCount.addEventListener("change", updateOfferPreview);
    }

    offerForm.querySelectorAll("[data-offer-step]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (!offerPayCount || offerPayCount.disabled) return;
        var delta = parseInt(btn.getAttribute("data-offer-step") || "0", 10) || 0;
        var next = (parseInt(offerPayCount.value, 10) || 5) + delta;
        if (next < 1) next = 1;
        if (next > 100) next = 100;
        offerPayCount.value = String(next);
        updateOfferPreview();
      });
    });

    document.querySelectorAll("[data-package-offer]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var name = btn.getAttribute("data-package-name") || "this package";
        var enabled = btn.getAttribute("data-package-offer-enabled") === "1";
        var count = btn.getAttribute("data-package-offer-pay-count") || "5";
        if (offerId) offerId.value = btn.getAttribute("data-package-id") || "";
        if (offerName) offerName.textContent = name;
        if (offerEnabled) offerEnabled.checked = enabled;
        if (offerPayCount) {
          offerPayCount.value = count === "0" ? "5" : count;
          offerPayCount.disabled = !enabled;
        }
        syncOfferModalFields();
        openModal("billing-package-offer-modal");
        if (offerEnabled) offerEnabled.focus();
      });
    });
  }

  var suspendModal = document.getElementById("billing-package-suspend-modal");
  var suspendForm = document.getElementById("billing-package-suspend-form");
  if (suspendModal && suspendForm) {
    var suspendTitle = document.getElementById("billing-package-suspend-title");
    var suspendSub = document.getElementById("billing-package-suspend-sub");
    var suspendVerb = document.getElementById("billing-package-suspend-verb");
    var suspendName = document.getElementById("billing-package-suspend-name");
    var suspendConfirmLabel = document.getElementById("billing-package-suspend-confirm-label");
    var suspendConfirm = document.getElementById("id_package_suspend_confirm");
    var suspendAction = document.getElementById("id_package_suspend_action");
    var suspendId = document.getElementById("id_package_suspend_id");
    var suspendSubmit = document.getElementById("billing-package-suspend-submit");

    document.querySelectorAll("[data-suspend-package]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var activating = btn.getAttribute("data-package-active") !== "1";
        var name = btn.getAttribute("data-package-name") || "this package";
        if (suspendId) suspendId.value = btn.getAttribute("data-package-id") || "";
        if (suspendAction) suspendAction.value = activating ? "unsuspend_package" : "suspend_package";
        if (suspendTitle) suspendTitle.textContent = activating ? "Unsuspend package" : "Suspend package";
        if (suspendSub) {
          suspendSub.textContent = activating
            ? "Make this package available again for new client assignments."
            : "Suspended packages stay in history but are hidden from new client assignments.";
        }
        if (suspendVerb) suspendVerb.textContent = activating ? "Unsuspend" : "Suspend";
        if (suspendName) suspendName.textContent = name;
        if (suspendConfirmLabel) {
          suspendConfirmLabel.textContent = activating
            ? "I confirm I want to unsuspend this package."
            : "I confirm I want to suspend this package.";
        }
        if (suspendConfirm) suspendConfirm.checked = false;
        if (suspendSubmit) {
          suspendSubmit.textContent = activating ? "Unsuspend package" : "Suspend package";
          suspendSubmit.classList.toggle("btn-danger", !activating);
          suspendSubmit.classList.toggle("btn-primary", activating);
        }
        openModal("billing-package-suspend-modal");
      });
    });
  }

  var deleteModal = document.getElementById("billing-package-delete-modal");
  var deleteForm = document.getElementById("billing-package-delete-form");
  if (deleteModal && deleteForm) {
    var deleteName = document.getElementById("billing-package-delete-name");
    var deleteId = document.getElementById("id_package_delete_id");
    var deleteConfirm = document.getElementById("id_package_delete_confirm");
    var deleteConfirmWrap = document.getElementById("billing-package-delete-confirm-wrap");
    var deleteSubmit = document.getElementById("billing-package-delete-submit");
    var clientsWarn = document.getElementById("billing-package-delete-clients-warn");
    var clientCount = document.getElementById("billing-package-delete-client-count");
    var stkWarn = document.getElementById("billing-package-delete-stk-warn");

    document.querySelectorAll("[data-delete-package]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var name = btn.getAttribute("data-package-name") || "this package";
        var customers = parseInt(btn.getAttribute("data-package-customers") || "0", 10) || 0;
        var stk = parseInt(btn.getAttribute("data-package-stk") || "0", 10) || 0;
        var blocked = stk > 0;

        if (deleteId) deleteId.value = btn.getAttribute("data-package-id") || "";
        if (deleteName) deleteName.textContent = name;
        if (deleteConfirm) {
          deleteConfirm.checked = false;
          deleteConfirm.required = !blocked;
          deleteConfirm.disabled = blocked;
        }
        if (deleteConfirmWrap) deleteConfirmWrap.hidden = blocked;
        if (clientsWarn) clientsWarn.hidden = blocked || customers < 1;
        if (clientCount) clientCount.textContent = String(customers);
        if (stkWarn) stkWarn.hidden = !blocked;
        if (deleteSubmit) {
          deleteSubmit.disabled = blocked;
          deleteSubmit.textContent = blocked ? "Cannot delete" : "Delete package";
        }
        openModal("billing-package-delete-modal");
      });
    });
  }
})();
</script>
