{% extends "accounts/role_base.html" %}

{% block title %}{{ page_title }} — ISPCENTRIC{% endblock %}

{% block topbar_title %}
  <p class="staff-topbar-kicker">{{ page_kicker }}</p>
  <h1 class="staff-topbar-heading">{{ page_title }}</h1>
{% endblock %}

{% block staff_content %}
<p class="page-sub client-page-lead">{{ page_subtitle }}</p>

<section class="panel staff-panel stack-gap">
  <div class="panel-head-row">
    <div>
      <h2>{{ page_title }}</h2>
      <p class="panel-sub">{{ page_subtitle }}</p>
    </div>
  </div>
  <p class="empty">{{ empty_text }}</p>
</section>
{% endblock %}
