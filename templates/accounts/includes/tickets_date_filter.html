{# Activated tickets filter: Day / Period / Month / Year (calendar pickers) #}
<form
  class="usage-range-filter tech-tickets-date-filter"
  method="get"
  action="{% url 'roles:technician_tickets_connected' %}"
  id="{{ tickets_filter_id|default:'tech-tickets-date-filter' }}"
>
  <div class="urf-modes" role="group" aria-label="Activation period">
    <label class="urf-mode{% if tickets_filter.ui_range == 'day' %} is-active{% endif %}">
      <input type="radio" name="range" value="day"{% if tickets_filter.ui_range == 'day' %} checked{% endif %}>
      <span>Day</span>
    </label>
    <label class="urf-mode{% if tickets_filter.ui_range == 'period' %} is-active{% endif %}">
      <input type="radio" name="range" value="period"{% if tickets_filter.ui_range == 'period' %} checked{% endif %}>
      <span>Period</span>
    </label>
    <label class="urf-mode{% if tickets_filter.ui_range == 'month' %} is-active{% endif %}">
      <input type="radio" name="range" value="month"{% if tickets_filter.ui_range == 'month' %} checked{% endif %}>
      <span>Month</span>
    </label>
    <label class="urf-mode{% if tickets_filter.ui_range == 'year' %} is-active{% endif %}">
      <input type="radio" name="range" value="year"{% if tickets_filter.ui_range == 'year' %} checked{% endif %}>
      <span>Year</span>
    </label>
  </div>

  <div class="urf-controls">
    <div
      class="urf-panel"
      data-range-panel="day"
      {% if tickets_filter.ui_range != 'day' %}hidden{% endif %}
    >
      <label class="urf-field" for="{{ tickets_filter_id|default:'tech-tickets-date-filter' }}-day">
        <span class="urf-label">Day</span>
        <input
          id="{{ tickets_filter_id|default:'tech-tickets-date-filter' }}-day"
          type="date"
          name="day"
          value="{{ tickets_filter.day }}"
        >
      </label>
    </div>

    <div
      class="urf-panel urf-panel-period"
      data-range-panel="period"
      {% if tickets_filter.ui_range != 'period' %}hidden{% endif %}
    >
      <label class="urf-field" for="{{ tickets_filter_id|default:'tech-tickets-date-filter' }}-start">
        <span class="urf-label">From</span>
        <input
          id="{{ tickets_filter_id|default:'tech-tickets-date-filter' }}-start"
          type="date"
          name="start"
          value="{{ tickets_filter.start }}"
        >
      </label>
      <span class="urf-range-sep" aria-hidden="true">–</span>
      <label class="urf-field" for="{{ tickets_filter_id|default:'tech-tickets-date-filter' }}-end">
        <span class="urf-label">To</span>
        <input
          id="{{ tickets_filter_id|default:'tech-tickets-date-filter' }}-end"
          type="date"
          name="end"
          value="{{ tickets_filter.end }}"
        >
      </label>
    </div>

    <div
      class="urf-panel"
      data-range-panel="month"
      {% if tickets_filter.ui_range != 'month' %}hidden{% endif %}
    >
      <label class="urf-field" for="{{ tickets_filter_id|default:'tech-tickets-date-filter' }}-month">
        <span class="urf-label">Month</span>
        <input
          id="{{ tickets_filter_id|default:'tech-tickets-date-filter' }}-month"
          type="month"
          name="month"
          value="{{ tickets_filter.month }}"
        >
      </label>
    </div>

    <div
      class="urf-panel"
      data-range-panel="year"
      {% if tickets_filter.ui_range != 'year' %}hidden{% endif %}
    >
      <label class="urf-field" for="{{ tickets_filter_id|default:'tech-tickets-date-filter' }}-year">
        <span class="urf-label">Year</span>
        <input
          id="{{ tickets_filter_id|default:'tech-tickets-date-filter' }}-year"
          type="number"
          name="year"
          min="2000"
          max="2100"
          step="1"
          placeholder="YYYY"
          value="{{ tickets_filter.year }}"
        >
      </label>
    </div>

    <button type="submit" class="urf-apply btn btn-primary btn-sm">Apply</button>
  </div>
</form>
<script>
(function () {
  var form = document.getElementById("{{ tickets_filter_id|default:'tech-tickets-date-filter' }}");
  if (!form) return;
  var modes = form.querySelectorAll('input[name="range"]');
  var panels = form.querySelectorAll("[data-range-panel]");
  var modeLabels = form.querySelectorAll(".urf-mode");

  function selectedRange() {
    var checked = form.querySelector('input[name="range"]:checked');
    return checked ? checked.value : "month";
  }

  function syncPanels() {
    var range = selectedRange();
    modeLabels.forEach(function (label) {
      var input = label.querySelector('input[name="range"]');
      label.classList.toggle("is-active", !!(input && input.checked));
    });
    panels.forEach(function (panel) {
      var match = panel.getAttribute("data-range-panel") === range;
      panel.hidden = !match;
      panel.querySelectorAll("input, select").forEach(function (input) {
        input.disabled = !match;
      });
    });
  }

  modes.forEach(function (input) {
    input.addEventListener("change", syncPanels);
  });
  syncPanels();
})();
</script>
