<a class="{% if current_page == 'dashboard' %}active{% endif %}" href="{% url 'roles:it_support' %}">Dashboard</a>
<a class="{% if current_page == 'commissions' and not commission_role_slug %}active{% endif %}" href="{% url 'roles:it_support_commissions' %}">All roles</a>
{% for row in commission_role_links %}
  <a class="{% if commission_role_slug == row.slug %}active{% endif %}" href="{% url 'roles:it_support_commission_role' role_slug=row.slug %}">{{ row.label }}</a>
{% endfor %}
