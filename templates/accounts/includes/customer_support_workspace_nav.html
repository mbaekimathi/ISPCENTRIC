{# In-page chips for Customer Support operations. Expects current_page. #}
<nav class="cs-workspace-nav" aria-label="Customer support sections">
  <a
    class="cs-workspace-nav-link{% if current_page == 'dashboard' %} is-active{% endif %}"
    href="{% url 'roles:customer_support' %}"
  >Dashboard</a>
  <a
    class="cs-workspace-nav-link{% if current_page == 'sales' or current_page == 'approved_sales' %} is-active{% endif %}"
    href="{% url 'roles:customer_support_sales' %}"
  >Sales</a>
  <a
    class="cs-workspace-nav-link{% if current_page == 'technician' or current_page == 'allocated' %} is-active{% endif %}"
    href="{% url 'roles:customer_support_technician' %}"
  >Technician</a>
  <a
    class="cs-workspace-nav-link{% if current_page == 'stock_audit' or current_page == 'network_equipment' or current_page == 'register_equipment' or current_page == 'allocate' %} is-active{% endif %}"
    href="{% url 'roles:customer_support_network_equipment' %}"
  >Stock Audit</a>
</nav>
