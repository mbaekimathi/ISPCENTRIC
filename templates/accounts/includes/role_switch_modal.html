{% if can_switch_roles %}
<div class="role-modal role-switch-modal" id="role-switch-modal" hidden aria-hidden="true">
  <div class="role-modal-backdrop" data-close-role-switch></div>
  <div class="role-modal-panel role-switch-panel" role="dialog" aria-modal="true" aria-labelledby="role-switch-title">
    <header class="role-modal-head role-switch-head">
      <div class="role-switch-head-main">
        <span class="role-switch-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <path d="M7 7a5 5 0 0 1 10 0v1.2a3.8 3.8 0 0 1 2.6 3.6v1.4a3.8 3.8 0 0 1-2.6 3.6V19a5 5 0 0 1-10 0v-2.2A3.8 3.8 0 0 1 4.4 13.2v-1.4A3.8 3.8 0 0 1 7 8.2V7Z" stroke="currentColor" stroke-width="1.7"/>
            <path d="M9.2 12h5.6M12 9.2v5.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </span>
        <div class="role-switch-head-copy">
          <p class="role-modal-kicker">IT Support</p>
          <h2 id="role-switch-title">Switch role view</h2>
          <p class="role-modal-sub">Choose a staff role or a client workspace. Your assigned role stays IT Support.</p>
        </div>
      </div>
      <button type="button" class="role-modal-close" data-close-role-switch aria-label="Close">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M6.7 6.7a1 1 0 0 1 1.4 0L12 10.6l3.9-3.9a1 1 0 1 1 1.4 1.4L13.4 12l3.9 3.9a1 1 0 1 1-1.4 1.4L12 13.4l-3.9 3.9a1 1 0 1 1-1.4-1.4L10.6 12 6.7 8.1a1 1 0 0 1 0-1.4Z"/></svg>
      </button>
    </header>

    <form method="post" action="{% url 'roles:switch_role' %}" class="role-switch-form" id="role-switch-form">
      {% csrf_token %}
      <div class="role-switch-body">
        <p class="role-switch-section-label">Available views</p>
        <div class="role-switch-grid" role="listbox" aria-label="Roles">
          {% for option in switchable_roles %}
            <label class="role-switch-option{% if option.selected %} is-selected{% endif %}" data-role="{{ option.value }}">
              <input
                type="radio"
                name="role"
                value="{{ option.value }}"
                {% if option.selected %}checked{% endif %}
                data-needs-client="{% if option.needs_client %}1{% else %}0{% endif %}"
                required
              >
              <span class="role-switch-option-body">
                <span class="role-switch-option-icon" aria-hidden="true">
                  {% if option.value == "super_admin" %}
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 2.5 14.4 8l5.8.5-4.4 3.8 1.4 5.7L12 15.5 6.8 18l1.4-5.7L3.8 8.5 9.6 8 12 2.5Z"/></svg>
                  {% elif option.value == "administrator" %}
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3.2a4.2 4.2 0 1 1 0 8.4 4.2 4.2 0 0 1 0-8.4Zm0 10c3.7 0 6.8 2.1 6.8 4.7v1.1H5.2v-1.1c0-2.6 3.1-4.7 6.8-4.7Z"/></svg>
                  {% elif option.value == "manager" %}
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4.5 6.5h15v2.2h-15V6.5Zm0 4.4h15v2.2h-15v-2.2Zm0 4.4h10.2V17.5H4.5v-2.2Z"/></svg>
                  {% elif option.value == "it_support" %}
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7.2 4.5h9.6l1.7 3.2v9.8a2 2 0 0 1-2 2H7.5a2 2 0 0 1-2-2V7.7l1.7-3.2Zm1.1 2.2-.7 1.3h9l-.7-1.3H8.3Zm3.2 3.2v6.2h1.5v-6.2h-1.5Z"/></svg>
                  {% elif option.value == "sales" %}
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4.5 18.5V8.2L12 4.5l7.5 3.7v10.3H4.5Zm2.2-2.2h10.6V9.6L12 7.1 6.7 9.6v6.7Z"/></svg>
                  {% elif option.value == "technician" %}
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M14.8 4.4a4.6 4.6 0 0 0-5.8 5.8l-5.1 5.1a2 2 0 0 0 2.8 2.8l5.1-5.1a4.6 4.6 0 0 0 5.8-5.8l-2.5 2.5-2.3-.5-.5-2.3 2.5-2.5Z"/></svg>
                  {% else %}
                    <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4.8 6.2h14.4v11.6H4.8V6.2Zm2.2 2.2v2.2h4.4V8.4H7Zm0 4.4v2.2h10V12.8H7Zm5.5-4.4v2.2H17V8.4h-4.5Z"/></svg>
                  {% endif %}
                </span>
                <span class="role-switch-option-copy">
                  <span class="role-switch-option-label">{{ option.label }}</span>
                  <span class="role-switch-option-path">{{ option.path }}</span>
                </span>
                <span class="role-switch-option-check" aria-hidden="true">
                  <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M9.6 16.4 5.8 12.6l1.4-1.4 2.4 2.4 6.2-6.2 1.4 1.4-7.6 7.6Z"/></svg>
                </span>
              </span>
            </label>
          {% endfor %}
        </div>

        <div class="role-switch-client-picker" id="role-switch-client-picker" hidden>
          <div class="role-switch-client-head">
            <span class="role-switch-client-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M4.5 6.2h15v2H4.5v-2Zm0 4.6h15v7H4.5v-7Zm2.2 2v3h4.4v-3H6.7Zm5.5 0v3h5.1v-3h-5.1Z"/></svg>
            </span>
            <label class="role-switch-client-label" for="role-switch-organization">Client organization</label>
          </div>
          <select
            class="form-control role-switch-client-select"
            name="organization_id"
            id="role-switch-organization"
            {% if selected_client_id %}data-selected="{{ selected_client_id }}"{% endif %}
          >
            <option value="">Select a client…</option>
            {% for client in switchable_clients %}
              <option value="{{ client.id }}" {% if selected_client_id == client.id %}selected{% endif %}>
                {{ client.name }}
              </option>
            {% endfor %}
          </select>
          <p class="role-switch-client-hint">Opens that client’s workspace at <code>/app/</code>.</p>
        </div>
      </div>

      <div class="role-modal-actions role-switch-actions">
        <button type="button" class="btn btn-ghost" data-close-role-switch>Cancel</button>
        <button type="submit" class="btn btn-primary">Apply view</button>
      </div>
    </form>
  </div>
</div>
<script>
(function () {
  var form = document.getElementById("role-switch-form");
  var picker = document.getElementById("role-switch-client-picker");
  var select = document.getElementById("role-switch-organization");
  if (!form || !picker || !select) return;

  function syncSelectedClass() {
    form.querySelectorAll(".role-switch-option").forEach(function (label) {
      var input = label.querySelector('input[name="role"]');
      label.classList.toggle("is-selected", !!(input && input.checked));
    });
  }

  function syncClientPicker() {
    var checked = form.querySelector('input[name="role"]:checked');
    var needsClient = checked && checked.getAttribute("data-needs-client") === "1";
    picker.hidden = !needsClient;
    select.required = !!needsClient;
    if (!needsClient) select.value = "";
    syncSelectedClass();
  }

  form.querySelectorAll('input[name="role"]').forEach(function (input) {
    input.addEventListener("change", syncClientPicker);
  });
  syncClientPicker();

  form.addEventListener("submit", function (e) {
    var checked = form.querySelector('input[name="role"]:checked');
    if (checked && checked.getAttribute("data-needs-client") === "1" && !select.value) {
      e.preventDefault();
      select.focus();
    }
  });
})();
</script>
{% endif %}
