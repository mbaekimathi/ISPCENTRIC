{% extends "base.html" %}

{% block title %}Check your email — ISPCENTRIC{% endblock %}

{% block body %}
<div class="auth-shell">
  <div class="auth-panel">
    <div class="auth-brand">ISP<span>CENTRIC</span></div>
    <h1>Check your email</h1>
    <p class="lede">
      If an account exists for that email, a password reset link has been sent.
      The link expires after a short time.
    </p>
    <p class="auth-footer">
      <a href="{% url 'accounts:login' %}">Back to ISP client login</a>
    </p>
  </div>
</div>
{% endblock %}
