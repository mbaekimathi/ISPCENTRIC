{% load static %}
<div class="toast-host" id="toast-host" aria-live="polite" aria-relevant="additions" hidden></div>
<script src="{% static 'js/toasts.js' %}?v=1"></script>
{% if messages %}
<script id="django-toast-messages" type="application/json">
[
{% for message in messages %}
{"tags":"{{ message.tags|default:'info'|escapejs }}","text":"{{ message|escapejs }}"}{% if not forloop.last %},{% endif %}
{% endfor %}
]
</script>
<script>
(function () {
  function boot() {
    if (!window.showToast) return;
    var el = document.getElementById("django-toast-messages");
    if (!el) return;
    try {
      var rows = JSON.parse(el.textContent || "[]");
      rows.forEach(function (row) {
        window.showToast({ type: row.tags || "info", text: row.text || "" });
      });
    } catch (e) {}
    if (el.parentNode) el.parentNode.removeChild(el);
    var host = document.getElementById("toast-host");
    if (host && host.children.length) host.hidden = false;
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
{% endif %}
