{% load static %}
<div
  id="mikrotik-job-banner"
  class="mk-banner mk-job-banner is-info"
  hidden
  role="status"
  aria-live="polite"
  data-mikrotik-job-banner
>
  <strong data-mikrotik-job-title>MikroTik update</strong>
  <span data-mikrotik-job-text></span>
</div>

<div
  id="mikrotik-job-progress"
  class="mk-job-progress"
  hidden
  role="dialog"
  aria-modal="true"
  aria-labelledby="mikrotik-job-progress-title"
  aria-live="polite"
  data-mikrotik-job-progress
>
  <div class="mk-job-progress-card">
    <header class="mk-job-progress-head">
      <div class="mk-job-progress-head-copy">
        <strong id="mikrotik-job-progress-title" data-mikrotik-job-progress-title>
          MikroTik update
        </strong>
        <p class="mk-job-progress-sub" data-mikrotik-job-progress-sub>
          Working in the background — keep this page open.
        </p>
      </div>
      <span class="mk-job-progress-spinner" aria-hidden="true" data-mikrotik-job-spinner></span>
    </header>
    <ol class="mk-job-progress-steps" data-mikrotik-job-steps></ol>
    <p class="mk-job-progress-detail" data-mikrotik-job-progress-detail></p>
  </div>
</div>

<script src="{% static 'js/mikrotik_job_progress.js' %}"></script>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var jobType = (params.get("job") || "").trim();
  if (!jobType || !window.MikrotikJobProgress) return;

  window.MikrotikJobProgress.watch({
    jobType: jobType,
    statusUrl:
      "{% url 'core:mikrotik_push_status' router_id=router.pk %}?job=" +
      encodeURIComponent(jobType),
    onComplete: function () {
      if (window.history && window.history.replaceState) {
        window.history.replaceState({}, "", window.location.pathname);
      }
    },
  });
})();
</script>
