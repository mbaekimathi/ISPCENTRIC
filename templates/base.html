{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}ISPCENTRIC{% endblock %}</title>
  <meta name="description" content="ISPCENTRIC — ISP operations platform with billing, staff, network, and more.">
  <meta name="theme-color" content="#0b1217" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#0e7c86" media="(prefers-color-scheme: light)">
  <script>
    (function () {
      try {
        var key = "ispcentric-theme";
        var stored = localStorage.getItem(key);
        var theme = stored === "light" || stored === "dark" ? stored : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]:not([media])');
        if (!meta) {
          meta = document.createElement("meta");
          meta.setAttribute("name", "theme-color");
          document.head.appendChild(meta);
        }
        meta.setAttribute("content", theme === "dark" ? "#0b1217" : "#0e7c86");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="{% static 'css/main.css' %}?v=123">
  {% block extra_head %}{% endblock %}
</head>
<body class="isp-body">
  {% block body %}{% endblock %}
  {% include "partials/toasts.html" %}
</body>
</html>
