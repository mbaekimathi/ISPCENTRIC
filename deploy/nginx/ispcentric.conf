# ISPCENTRIC — nginx site for isp.richcom.co.ke
#
# Install:
#   sudo cp deploy/nginx/ispcentric.conf /etc/nginx/sites-available/ispcentric
#   sudo ln -sf /etc/nginx/sites-available/ispcentric /etc/nginx/sites-enabled/ispcentric
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# CAPTIVE PORTAL (Hotspot / PPPoE pay):
#   Phones only need plain HTTP :80 to this host (MikroTik walled garden).
#   Do NOT force the whole site to HTTPS. If certbot adds a 443 server with
#   "return 301 https://…", captive sheets time out (ERR_CONNECTION_TIMED_OUT)
#   and phones stick on "Connected, no internet". Keep :80 open forever, and
#   if you enable TLS, redirect /hotspot/ and /pppoe/ captive paths BACK to http.

upstream ispcentric_app {
    server unix:/run/ispcentric/gunicorn.sock fail_timeout=0;
}

server {
    # default_server matters: expired PPPoE clients are dst-nat'd here with the
    # original Host header still set (www.msftconnecttest.com and friends), so
    # this block has to answer for hostnames other than its own. Django's
    # CaptiveHostRewriteMiddleware normalises them before routing.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name isp.richcom.co.ke _;

    client_max_body_size 25m;

    # Let's Encrypt HTTP-01. Keep this reachable on port 80 even after TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /opt/ispcentric/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /opt/ispcentric/media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://ispcentric_app;
        proxy_redirect off;
        # Host is forwarded unchanged so captive probes stay recognisable.
        proxy_set_header Host $http_host;
        # RealClientIpMiddleware reads this to recover the PPPoE session address.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Captive pay must see http — do not claim https on the :80 vhost.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        # Other MikroTik ops can still run in-request; package speed sync is now backgrounded.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# Optional TLS for admin / Google OAuth. Certbot may create a similar block —
# if it does, KEEP captive paths on HTTP (see location blocks below). Do not
# replace the :80 server with a blanket "return 301 https://$host$request_uri".
