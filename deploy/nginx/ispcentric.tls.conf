# ISPCENTRIC — nginx HTTP + HTTPS for isp.richcom.co.ke
#
# Installed by: sudo bash scripts/vps_enable_tls.sh
# Do not use `certbot --nginx` — it may inject a site-wide HTTP→HTTPS redirect
# that breaks Hotspot/PPPoE captive sheets.
#
# RIGHT PLACES:
#   :80  — captive probes, Hotspot/PPPoE pay, ACME challenge, fallback
#   :443 — admin UI, Google OAuth, Daraja STK callbacks
#   /hotspot/ and /pppoe/ on :443 → 302 back to http://

upstream ispcentric_app {
    server unix:/run/ispcentric/gunicorn.sock fail_timeout=0;
}

server {
    # default_server matters: expired PPPoE clients are dst-nat'd here with the
    # original Host header still set (www.msftconnecttest.com and friends).
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name isp.richcom.co.ke _;

    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /opt/ispcentric/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /opt/ispcentric/media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://ispcentric_app;
        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name isp.richcom.co.ke;

    ssl_certificate     /etc/letsencrypt/live/isp.richcom.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isp.richcom.co.ke/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    # Captive Hotspot/PPPoE MUST stay on http:// — walled garden is :80 only.
    location ~ ^/(hotspot|pppoe)/ {
        return 302 http://$host$request_uri;
    }

    location /static/ {
        alias /opt/ispcentric/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /opt/ispcentric/media/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://ispcentric_app;
        proxy_redirect off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 15s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
